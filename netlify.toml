# Static, keyless demo of the CodeMind UI (in-browser search over data/complete_dataset.json).
# Deployed manually with the Netlify CLI; this file documents the build if you connect the repo.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_SEARCH_MODE = "browser"
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
